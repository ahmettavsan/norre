<!doctype html>
<!-- Instagram feed poster (1080×1350). Render: node render.mjs (from this folder, with playwright-core). -->
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Silkscreen&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1d1d1f;
        --ink-2: #6e6e73;
        --todo: #ffe66d;
        --looking: #ffa8e8;
        --bought: #93efc9;
        --yellow: #ffc21a;
        --shadow: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 24px 60px -12px rgba(0, 0, 0, 0.22);
      }
      html,
      body {
        margin: 0;
      }
      body {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
        color: var(--ink);
        /* A whiteboard: warm paper with a faint dot grid. */
        background:
          radial-gradient(circle, rgba(0, 0, 0, 0.09) 1.4px, transparent 1.6px) 0 0 / 32px 32px,
          #f7f6f3;
      }
      .brand {
        position: absolute;
        top: 64px;
        left: 72px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brand img {
        width: 52px;
        height: 52px;
      }
      .brand span {
        font-family: 'Silkscreen', monospace;
        font-size: 40px;
        letter-spacing: 3px;
        line-height: 1;
      }
      .kicker {
        position: absolute;
        top: 80px;
        right: 72px;
        font-size: 24px;
        color: var(--ink-2);
      }
      h1 {
        position: absolute;
        top: 156px;
        left: 68px;
        margin: 0;
        font-family: 'Caveat', cursive;
        font-weight: 700;
        font-size: 150px;
        line-height: 0.92;
        letter-spacing: -1px;
      }
      h1 .line2 {
        position: relative;
        display: inline-block;
      }
      h1 svg {
        position: absolute;
        left: -4px;
        right: -8px;
        bottom: -14px;
        width: calc(100% + 12px);
        height: 26px;
      }
      .sub {
        position: absolute;
        top: 476px;
        left: 72px;
        width: 640px;
        margin: 0;
        font-size: 31px;
        line-height: 1.4;
        color: var(--ink-2);
      }
      .sub b {
        font-weight: 600;
        color: var(--ink);
      }

      /* The app in a browser window. */
      .window {
        position: absolute;
        top: 604px;
        left: 72px;
        width: 960px;
        border-radius: 20px;
        overflow: hidden;
        background: #fff;
        box-shadow: var(--shadow);
      }
      .window .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 16px;
        background: #f2f2f4;
        border-bottom: 1px solid rgba(0, 0, 0, 0.07);
      }
      .window .bar i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #d9d9de;
      }
      .window img {
        display: block;
        width: 100%;
        /* The board without the empty strip at the bottom of the screen. */
        height: 540px;
        object-fit: cover;
        object-position: top;
      }

      /* Cards and the summary, lifted off the board like sticky notes. */
      .note {
        position: absolute;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: var(--shadow);
        background: #fff;
      }
      .note img {
        display: block;
        width: 100%;
      }
      .card-a {
        top: 520px;
        right: 48px;
        width: 268px;
        transform: rotate(5deg);
      }
      .card-b {
        top: 948px;
        left: 36px;
        width: 250px;
        transform: rotate(-6deg);
      }
      .summary {
        top: 846px;
        right: 40px;
        width: 290px;
        height: 318px;
        border-radius: 24px;
      }

      .foot {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .chips {
        display: flex;
        gap: 12px;
      }
      .chip {
        padding: 10px 20px;
        border-radius: 999px;
        font-size: 24px;
        font-weight: 600;
      }
      .cta {
        font-size: 25px;
        color: var(--ink-2);
      }
      .cta b {
        color: var(--ink);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="brand"><img src="assets/favicon.svg" alt="" /><span>nook</span></div>
    <div class="kicker">Ev eşyası panosu</div>

    <h1>
      Yeni evin,<br />
      <span class="line2"
        >oda oda.<svg viewBox="0 0 200 14" preserveAspectRatio="none" aria-hidden="true">
          <path
            d="M2 9 C 40 3, 90 12, 130 6 S 185 4, 198 8"
            fill="none"
            stroke="var(--yellow)"
            stroke-width="3.5"
            stroke-linecap="round"
          /></svg
      ></span>
    </h1>
    <p class="sub">
      Alacağın eşyaları odalara kart kart diz. <b>Fiyatı, bütçeyi ve teslimatı</b> tek panoda takip et.
    </p>

    <div class="window">
      <div class="bar"><i></i><i></i><i></i></div>
      <img src="assets/board.jpg" alt="" />
    </div>

    <div class="note card-a"><img src="assets/card1.jpg" alt="" /></div>
    <div class="note card-b"><img src="assets/card0.jpg" alt="" /></div>
    <div class="note summary"><img src="assets/summary.jpg" alt="" /></div>

    <div class="foot">
      <div class="chips">
        <span class="chip" style="background: var(--todo)">Alınacak</span>
        <span class="chip" style="background: var(--looking)">Bakılıyor</span>
        <span class="chip" style="background: var(--bought)">Alındı</span>
      </div>
      <div class="cta">Kayıt olmadan başla · <b>link bioda</b></div>
    </div>
  </body>
</html>
